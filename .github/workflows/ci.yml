name: ci

# The demo systems under test that TruAssure's pilots drive: each app's lint, offline tests with its coverage gate,
# and its Docker images.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sut-llm-factory:
    name: LLM factory / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: common/harbor_llm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: install with every provider SDK
        run: python -m pip install -e ".[all,dev]"
      - name: lint and type-check
        run: |
          ruff check src tests
          mypy
      - name: offline tests + 95% coverage gate
        run: python -m pytest -q --cov

  sut-chat-assistant:
    name: chat assistant
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-assistant
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -e "../common/harbor_llm[all]" -r requirements.txt pytest pytest-asyncio pytest-cov httpx ruff
      - name: lint
        run: ruff check insurance_copilot tests
      - name: offline tests + 95% coverage gate
        run: python -m pytest -q --cov --cov-fail-under=95
      - name: docker image builds
        working-directory: .
        run: docker compose -f chat-assistant/docker-compose.yml build

  sut-claims-agent:
    name: claims agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claims-agent
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -e "../common/harbor_llm[all]" -r requirements.txt pytest pytest-asyncio pytest-cov httpx ruff
      - name: lint
        run: ruff check claims_agent tests
      - name: offline tests + 95% coverage gate
        run: python -m pytest -q --cov
      - name: docker images build
        run: docker compose build

  sut-expense-agent:
    name: expense agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expense-agent
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -e "../common/harbor_llm[all]" -r requirements.txt pytest pytest-asyncio pytest-cov httpx ruff
      - name: lint
        run: ruff check expense_agent tests
      - name: offline tests + 95% coverage gate
        run: python -m pytest -q --cov
      - name: the PyPI wheel builds (it carries harbor_llm)
        run: |
          python -m pip install build
          python -m build --wheel --outdir /tmp/expense-dist
          python -m zipfile -l /tmp/expense-dist/*.whl | grep -q "harbor_llm/factory.py"
      - name: docker images build
        run: docker compose build

  sut-multi-agent-desk:
    name: multi-agent desk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multi-agent-desk
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -e "../common/harbor_llm[all]" -r requirements.txt pytest pytest-asyncio pytest-cov ruff
      - name: lint
        run: ruff check desk tests
      - name: offline tests + 95% coverage gate
        run: python -m pytest -q --cov
      - name: docker images build
        run: docker compose build

  sut-automation-lab:
    name: automation lab
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation-lab
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -r requirements.txt pytest pytest-cov httpx ruff
      - name: lint
        run: ruff check automation_lab tests
      - name: offline tests + 95% coverage gate
        run: python -m pytest -q --cov
      - name: docker image builds
        run: docker compose build

  # The Windows desktop app: no Python and no image. It builds with the C# compiler that ships with Windows; the
  # self-test covers prices, rules, the store, options and every UI release rule. (tools\smoke.bat drives the real
  # UI and needs an interactive desktop, so it runs locally, not here.)
  sut-policy-desk:
    name: policy desk (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
        working-directory: policy-desk
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: build the app (warnings are errors)
        run: app\build.bat
      - name: self-test
        run: app\bin\policydesk-cli.exe --self-test
      - name: locator maps for every release
        run: |
          for %%r in (v1 v2 v3 v4) do app\bin\policydesk-cli.exe --locator-map %%r --release-seed 1 --out %RUNNER_TEMP%\locator-map-%%r.json || exit /b 1
      - name: UI Automation tools build
        run: tools\build_tools.bat
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: lint the baseline suite (it drives the real UI, so it runs locally)
        run: |
          python -m pip install -r requirements-test.txt || exit /b 1
          ruff check screens tests tools || exit /b 1
          python -m pytest --collect-only -q

  # After every app's tests pass on main: publish the images TruAssure's pilot tests run (black-box, over HTTP).
  # Tags: sha-<commit> (what TruAssure pins) and latest.
  publish-images:
    name: publish images
    needs: [sut-llm-factory, sut-chat-assistant, sut-claims-agent, sut-expense-agent, sut-multi-agent-desk, sut-automation-lab, sut-policy-desk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build and push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="sha-${GITHUB_SHA::7}"
          for app in claims-agent:harbor-claims-agent expense-agent:harbor-expense-agent multi-agent-desk:harbor-member-desk chat-assistant:harbor-chat-assistant automation-lab:harbor-automation-lab; do
            dir="${app%%:*}"; name="${app##*:}"; ref="ghcr.io/$OWNER/$name"
            docker build -f "$dir/Dockerfile" \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$ref:$TAG" -t "$ref:latest" .
            docker push "$ref:$TAG"
            docker push "$ref:latest"
          done
          echo "published tag $TAG" >> "$GITHUB_STEP_SUMMARY"
