# Harbor Mutual billing defaults. These are business rules: docs/specs/billing-rules.md and refund-rules.md say
# what each one must be. Deployment-specific settings (data directory, timezone override, sandbox token) are
# environment variables, see README.md.
currency: USD
timezone: America/New_York   # the billing day, BR-10
grace_days: 5                # BR-08
free_look_days: 10           # RF-02
renewal_notice_days: 45      # BR-14
reminder_days: 7             # BR-15
fees:
  late: "10.00"              # BR-11
  cancellation: "25.00"      # RF-04
  returned_payment: "15.00"  # BR-21
  installment:               # BR-06, per installment
    annual: "0.00"
    semiannual: "0.00"
    quarterly: "2.00"
    monthly: "3.00"
