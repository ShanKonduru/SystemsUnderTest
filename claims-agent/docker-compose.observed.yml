# Observed deployment: the TruAssure recording proxy sits between the agent and its MCP tools.
#   docker compose -f claims-agent/docker-compose.yml -f claims-agent/docker-compose.observed.yml up -d --build
# Every tool call is logged to claims-agent/data/proxy-logs/ (read by TruAssure), and faults can be armed on
# 127.0.0.1:${CLAIMS_PROXY_PORT:-9400} with TA_PROXY_TOKEN (from the root .env).
services:
  claims-proxy:
    build:
      context: ${TRUASSURE_DIR:-../../TruAssure-EnterpriseAgenticQualityEngineeringAccelerator}   # TruAssure's repository (the proxy image)
      dockerfile: docker/proxy.Dockerfile
    image: truassure/proxy:dev
    command: ["--upstream", "http://claims-tools:9100", "--listen", "0.0.0.0:9400", "--allow-remote",
              "--log-dir", "/logs", "--principal-header", "X-Principal"]
    environment:
      TA_PROXY_TOKEN: ${TA_PROXY_TOKEN:-}
    volumes:
      - ./data/proxy-logs:/logs
    ports:
      - "127.0.0.1:${CLAIMS_PROXY_PORT:-9400}:9400"
    depends_on:
      claims-tools: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9400/_ta/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  claims-agent:
    environment:
      CLAIMS_TOOLS_URL: http://claims-proxy:9400/mcp
    depends_on:
      claims-proxy: {condition: service_healthy}
