[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "harbor-llm"
version = "0.1.0"
description = "LLM factory for the Harbor Mutual demo apps: one interface over Anthropic, OpenAI, Azure OpenAI, Ollama, AWS Bedrock, Google Gemini/Vertex AI and any OpenAI-compatible endpoint."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.50"]            # OpenAI, Azure OpenAI, Ollama, any OpenAI-compatible endpoint
bedrock = ["boto3>=1.35"]
gemini = ["google-genai>=1.30"]      # Gemini API and Vertex AI
all = ["harbor-llm[anthropic,openai,bedrock,gemini]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["harbor_llm"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
