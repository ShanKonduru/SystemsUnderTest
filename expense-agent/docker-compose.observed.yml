# Observed deployment: the TruAssure recording proxy sits between the agent and its MCP tools.
#   docker compose -f expense-agent/docker-compose.yml -f expense-agent/docker-compose.observed.yml up -d --build
# Every tool call is logged to expense-agent/data/proxy-logs/ (read by TruAssure), and faults can be armed on
# 127.0.0.1:${EXPENSE_PROXY_PORT:-9710} with TA_PROXY_TOKEN (from the root .env).
services:
  expense-proxy:
    image: ${TRUASSURE_PROXY_IMAGE:-truassure/proxy:dev}   # TruAssure's proxy image (TruAssure's scripts build it)
    command: ["--upstream", "http://expense-tools:9700", "--listen", "0.0.0.0:9400", "--allow-remote",
              "--log-dir", "/logs", "--principal-header", "X-Principal"]
    environment:
      TA_PROXY_TOKEN: ${TA_PROXY_TOKEN:-}
    volumes:
      - ./data/proxy-logs:/logs
    ports:
      - "127.0.0.1:${EXPENSE_PROXY_PORT:-9710}:9400"
    depends_on:
      expense-tools: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9400/_ta/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  expense-agent:
    environment:
      EXPENSE_TOOLS_URL: http://expense-proxy:9400/mcp
    depends_on:
      expense-proxy: {condition: service_healthy}
