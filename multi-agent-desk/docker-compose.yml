# Harbor Mutual member desk (system under test): a triage agent hands off to billing and claims agents over HTTP,
# carrying the member's signed identity; every tool call is verified and audited with the agent chain.
#   docker compose -f SUT/multi-agent-desk/docker-compose.yml up -d --build
#   curl -X POST http://127.0.0.1:8300/requests -H "X-Principal: M-1001" -H "Content-Type: application/json" \
#        -d '{"message": "Why was my claim CLM-5003 payment lower than my bill for POL-1002?"}'
# LLM settings come from the repo root's .env (DEFAULT_LLM_PROVIDER, or DESK_LLM_PROVIDER for this app only).
# The identity signing key is generated by desk-tools into ./data on first start (or set DESK_SIGNING_KEY in .env).
name: harbor-member-desk

x-common: &common
  build:
    context: ..
    dockerfile: multi-agent-desk/Dockerfile
  image: harbor-mutual/member-desk:dev
  env_file:
    - path: ../../.env
      required: false
  volumes:
    - ./data:/app/data          # desk.db and the signing key; readable from the host
  restart: unless-stopped

x-agent-env: &agent-env
  DESK_TODAY: ${DESK_TODAY:-2026-11-03}
  DESK_TOOLS_URL: ${DESK_TOOLS_URL:-http://desk-tools:9300}
  DESK_BILLING_URL: ${DESK_BILLING_URL:-http://desk-billing:8301}
  DESK_CLAIMS_URL: ${DESK_CLAIMS_URL:-http://desk-claims:8302}
  DESK_MAX_STEPS: ${DESK_MAX_STEPS:-8}

x-health: &health
  interval: 10s
  timeout: 3s
  start_period: 10s
  retries: 3

services:
  desk-tools:
    <<: *common
    command: ["python", "-m", "desk.tools_server", "--host", "0.0.0.0", "--port", "9300"]
    environment:
      DESK_TODAY: ${DESK_TODAY:-2026-11-03}
      DESK_SANDBOX_TOKEN: ${DESK_SANDBOX_TOKEN:-}
      DESK_FAULT_DELAY: ${DESK_FAULT_DELAY:-2}
      DESK_ALLOWED_HOSTS: ${DESK_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,desk-tools:*}
    ports:
      - "127.0.0.1:${DESK_TOOLS_PORT:-9300}:9300"
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9300/healthz', timeout=2)"]

  desk-claims:
    <<: *common
    command: ["uvicorn", "desk.service:claims_app", "--factory", "--host", "0.0.0.0", "--port", "8302"]
    environment: *agent-env
    depends_on:
      desk-tools: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8302/healthz', timeout=2)"]

  desk-billing:
    <<: *common
    command: ["uvicorn", "desk.service:billing_app", "--factory", "--host", "0.0.0.0", "--port", "8301"]
    environment: *agent-env
    depends_on:
      desk-tools: {condition: service_healthy}
      desk-claims: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8301/healthz', timeout=2)"]

  desk-triage:
    <<: *common
    command: ["uvicorn", "desk.service:triage_app", "--factory", "--host", "0.0.0.0", "--port", "8300"]
    environment: *agent-env
    ports:
      - "127.0.0.1:${DESK_PORT:-8300}:8300"
    depends_on:
      desk-billing: {condition: service_healthy}
      desk-claims: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/healthz', timeout=2)"]
